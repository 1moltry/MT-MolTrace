[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moltrace"
version = "3.0.0"
description = "MOLTRACE — single-molecule nanopore current-trace analysis workbench"
authors = [
    { name = "Yize Liu (1moltry), Huang Lab" },
]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.0", "scipy>=1.12", "matplotlib>=3.8", "openpyxl>=3.1", "pyabf>=2.3"]

[project.urls]
Homepage = "https://github.com/1moltry/MT-MolTrace"
Repository = "https://github.com/1moltry/MT-MolTrace"
Issues = "https://github.com/1moltry/MT-MolTrace/issues"

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13"]
dev = ["pytest>=8.0", "PyQt5>=5.15", "pyqtgraph>=0.13"]

[project.scripts]
moltrace = "nanopore.cli:main"
nanopore = "nanopore.cli:main"      # legacy alias

[tool.setuptools]
packages = ["nanopore", "nanopore.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
